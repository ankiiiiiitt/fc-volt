<!doctype html><html><meta charset="utf-8"><title>Do Not Claim template checks</title><button id="run">Run template checks</button><pre id="result">Ready</pre><a id="sample" hidden download="do-not-claim-verified.png">Download verified poster</a><iframe id="app" src="../avoid.html" style="width:100%;height:1200px"></iframe><script>
const frame=document.getElementById('app'),result=document.getElementById('result');
const wait=async f=>{for(let i=0;i<300;i++){if(f())return;await new Promise(r=>setTimeout(r,100));}throw Error('Timed out');};
const assert=(v,m)=>{if(!v)throw Error(m);};
function upload(w,id,files){const dt=new w.DataTransfer();files.forEach(f=>dt.items.add(f));const input=w.document.getElementById(id);input.files=dt.files;input.dispatchEvent(new w.Event('change',{bubbles:true}));}
function input(w,id,value){const el=w.document.getElementById(id);el.value=value;el.dispatchEvent(new w.Event('input',{bubbles:true}));}
async function png(w,color,card){const c=w.document.createElement('canvas');c.width=card?240:1920;c.height=card?310:1080;const g=c.getContext('2d');g.fillStyle=card?'#ffffff':color;g.fillRect(0,0,c.width,c.height);if(card){g.beginPath();g.moveTo(25,24);g.lineTo(215,24);g.lineTo(215,250);g.quadraticCurveTo(215,280,120,299);g.quadraticCurveTo(25,280,25,250);g.closePath();const grad=g.createLinearGradient(0,0,240,310);grad.addColorStop(0,color);grad.addColorStop(1,'#090815');g.fillStyle=grad;g.fill();g.strokeStyle='#efd186';g.lineWidth=5;g.stroke();g.fillStyle='#ffffff35';g.beginPath();g.arc(128,115,34,0,Math.PI*2);g.fill();g.beginPath();g.ellipse(128,182,58,42,0,0,Math.PI*2);g.fill();g.fillStyle='#fff';g.font='bold 33px Arial';g.fillText('124',40,68);g.font='bold 18px Arial';g.fillText('RW',40,93);g.fillStyle='#080a14';g.fillRect(30,215,180,37);g.fillStyle='#fff';g.textAlign='center';g.font='bold 23px Arial';g.fillText('DEMO CARD',120,242);}return new w.File([await new Promise(r=>c.toBlob(r))],'test.png',{type:'image/png'});}
document.getElementById('run').onclick=async()=>{result.textContent='Running…';try{
 const w=frame.contentWindow,d=w.document;await wait(()=>d.querySelectorAll('.rank-row').length===10&&!d.getElementById('download').disabled);
 const files=[];for(let i=0;i<10;i++)files.push(await png(w,i%2?'#274ca1':'#3d254f',true));upload(w,'bulkCards',files);await wait(()=>d.getElementById('benchCount').textContent==='10 cards');assert(d.getElementById('cardCount').textContent==='0 / 10 ranked','Bulk upload ranked cards automatically');
 const dt=new w.DataTransfer(),dragButton=d.querySelector('[aria-label="Select bench card 1"]');dragButton.dispatchEvent(new w.DragEvent('dragstart',{bubbles:true,dataTransfer:dt}));d.querySelector('[aria-label="Rank 1"]').dispatchEvent(new w.DragEvent('drop',{bubbles:true,cancelable:true,dataTransfer:dt}));assert(d.getElementById('cardCount').textContent==='1 / 10 ranked','Dragging bench card to rank failed');d.querySelector('[aria-label="Return rank 1 to bench"]').click();
 for(let i=0;i<10;i++){d.querySelector('[aria-label="Select bench card 1"]').click();d.querySelector(`[aria-label="Place selected card at rank ${i+1}"]`).click();}
 assert(d.getElementById('cardCount').textContent==='10 / 10 ranked','Bench selection did not place cards');
 d.querySelector('[aria-label="Return rank 1 to bench"]').click();assert(d.getElementById('benchCount').textContent==='1 cards','Return to bench failed');d.querySelector('[aria-label="Select bench card 1"]').click();d.querySelector('[aria-label="Place selected card at rank 1"]').click();
 d.querySelector('[aria-label="Place selected card at rank 1"]').click();d.getElementById('removeBackground').click();await wait(()=>!d.getElementById('restoreCard').disabled);assert(d.getElementById('status').textContent.includes('Background removed'),'Removal failed');
 const cleaned=new Image();cleaned.src=d.querySelector('.rank-place img').src;await cleaned.decode();assert(cleaned.width<240&&cleaned.height<310,'White border was not removed and cropped');
 d.getElementById('restoreCard').click();await wait(()=>d.getElementById('restoreCard').disabled&&!d.getElementById('download').disabled);const restored=new Image();restored.src=d.querySelector('.rank-place img').src;await restored.decode();assert(restored.width===240,'Restore lost original');

 for(let i=0;i<10;i++){d.querySelector(`[aria-label="Place selected card at rank ${i+1}"]`).click();d.getElementById('removeBackground').click();await wait(()=>!d.getElementById('restoreCard').disabled);}
 for(let i=0;i<10;i++)input(w,'cost'+i,String((i+1)*150));input(w,'posterTitle','TOP 10 • DO NOT CLAIM');
 d.querySelector('[aria-label="Move rank 1 down"]').click();assert(d.getElementById('cost0').value==='300'&&d.getElementById('cost1').value==='150','Rank move lost its cost');d.querySelector('[aria-label="Move rank 2 up"]').click();
 for(const button of d.querySelectorAll('[data-scene]')){button.click();await wait(()=>!d.getElementById('download').disabled);assert(button.getAttribute('aria-pressed')==='true','Preset did not apply');}
 upload(w,'customBackground',[await png(w,'#295a68',false)]);await wait(()=>d.getElementById('backgroundName').textContent==='Your background');
 let blobURL;const original=w.HTMLAnchorElement.prototype.click;w.HTMLAnchorElement.prototype.click=function(){blobURL=this.href;};d.getElementById('download').click();await wait(()=>blobURL);w.HTMLAnchorElement.prototype.click=original;
 const blob=await(await fetch(blobURL)).blob(),image=await createImageBitmap(blob);assert(image.width===1080&&image.height===1240,'Wrong PNG dimensions');const c=document.createElement('canvas');c.width=1080;c.height=1240;const g=c.getContext('2d');g.drawImage(image,0,0);
 const cross=g.getImageData(385,192,1,1).data;assert(cross[0]>180,'Cross missing from export');const bg=g.getImageData(2,500,1,1).data;assert(bg[2]>bg[0],'Custom background missing');
 d.querySelector('[data-scene="0"]').click();await wait(()=>!d.getElementById('download').disabled);assert(d.getElementById('backgroundName').textContent==='Sunset Flame','Default reference background unavailable');
 const sample=document.getElementById('sample');sample.href=URL.createObjectURL(blob);sample.hidden=false;
 result.textContent='PASS: 10 cards upload to bench without auto ranking; bench-to-rank placement and return; background removal and restore; all shard costs; editable title; rank order preserves cost; 10 backgrounds; custom background; 1080 × 1240 PNG; cross and custom background in exported pixels.\nALL CHECKS PASSED';
 }catch(e){result.textContent+='\nFAIL: '+e.message;}};
</script></html>
